[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pynemo"
version = "0.1.0"
description = "Nemo — local-first AI data exploration agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "numpy",
    "openai",
    "pandas",
    "pydantic",
    "python-dotenv",
    "rich",
    "scipy",
    "statsmodels",
    "tomli-w",
    "typer[all]",
]

[project.scripts]
nemo = "nemo.cli:app"

[tool.setuptools.packages.find]
include = ["nemo*"]

[tool.setuptools.package-data]
nemo = ["store/schema.sql"]

[tool.pytest.ini_options]
addopts = "-q -m 'not slow'"
markers = [
    "slow: long-running tests (e.g., end-to-end/golden flows)",
    "e2e: end-to-end integration tests",
    "llm: tests that may invoke external LLM APIs",
]
