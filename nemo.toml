[budget]
max_steps = 100
max_runtime_minutes = 30
max_query_runtime_ms = 15000
saturation_threshold = 0.15

[scoring]
weight_info_gain = 0.3
weight_impact = 0.25
weight_novelty = 0.2
weight_feasibility = 0.15
weight_diversity = 0.1

[llm]
model = "gpt-5-mini"

[exploration]
reflect_every = 10
max_actions_per_thread = 5
join_confidence_threshold = 0.7
use_learnings = true
max_steps_per_theme = 4
question_similarity_threshold = 0.82
stagnation_step_limit = 3
arbiter_interval = 3
max_validation_steps = 5
arbiter_model = "gpt-5.2"

[analysis]
max_analysis_rows = 50000
analysis_timeout_seconds = 30
analyst_max_iterations = 8

[hints]
time_columns = []
important_dimensions = []

[hints.join_overrides]

[hints.metrics]

[hooks]

[output]
verbose = false
quiet = false
